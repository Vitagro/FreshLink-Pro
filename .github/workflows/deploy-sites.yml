name: Deploy static Vita sites to Hostinger
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [sites/deploy-manifest.json, scripts/prepare-vita-sites.mjs, scripts/install-vita-sites.sh, .github/workflows/deploy-sites.yml]
permissions:
  contents: read
concurrency:
  group: deploy-sites
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned public website sources
        run: node scripts/prepare-vita-sites.mjs
      - name: Prepare SSH transport
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
      - name: Back up and publish public website files
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote="/home/u387018932/backups/sites/$stamp"
          ssh=(sshpass -e ssh -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST")
          scp=(sshpass -e scp -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -P "$SSH_PORT")
          "${ssh[@]}" "umask 077; mkdir -p '$remote'; chmod 700 /home/u387018932/backups/sites '$remote'"
          tar -czf vita-sites.tar.gz -C site-bundle .
          sha256sum vita-sites.tar.gz > vita-sites.tar.gz.sha256
          "${scp[@]}" vita-sites.tar.gz vita-sites.tar.gz.sha256 "$SSH_USER@$SSH_HOST:$remote/"
          "${ssh[@]}" bash -s -- "$stamp" < scripts/install-vita-sites.sh
      - name: Verify HTTPS and deployed content
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const sites=JSON.parse(fs.readFileSync('sites/deploy-manifest.json','utf8'));
          const results=await Promise.all(sites.map(async site=>{
            const expected=crypto.createHash('sha256').update(fs.readFileSync(`site-bundle/${site.name}/index.html`)).digest('hex');
            for(let attempt=0;attempt<6;attempt++){
              try {
                const r=await fetch(`https://${site.domain}/?release=${process.env.GITHUB_RUN_ID}`,{signal:AbortSignal.timeout(20000)});
                const body=Buffer.from(await r.arrayBuffer());
                if(r.ok && crypto.createHash('sha256').update(body).digest('hex')===expected){console.log(`${site.domain}: HTTPS and exact content verified`);return true;}
              }catch(e){console.log(`${site.domain}: waiting for HTTPS availability`);}
              await new Promise(r=>setTimeout(r,10000));
            }
            console.error(`${site.domain}: public verification failed; private backup retained`);return false;
          }));
          if(results.some(ok=>!ok))process.exit(1);
          JS
