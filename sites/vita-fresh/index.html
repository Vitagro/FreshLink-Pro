<title>Vita Fresh — Fresh produce distribution · Casablanca</title>
<meta name="description" content="Vita Fresh — B2B distribution of fresh fruit, vegetables and herbs in Morocco, powered by the FreshLink ERP.">

<style>
:root{--ink:#0E2A1E;--forest:#1E5631;--moss:#2E7D4F;--leaf:#5CA829;--gold:#D4A843;--gold-soft:#E6C874;--paper:#F5F1E6;--paper-2:#EDE7D6;--line:rgba(14,42,30,.14);--line-gold:rgba(212,168,67,.35);--shadow:0 1px 0 rgba(14,42,30,.05),0 20px 44px -26px rgba(14,42,30,.4);--maxw:1180px}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:"Inter Tight",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}
h1,h2,h3{font-family:"Fraunces",serif;font-weight:600;line-height:1.04;letter-spacing:-.015em}
a{color:inherit;text-decoration:none}[hidden]{display:none!important}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--moss)}
header.nav{position:sticky;top:0;z-index:50;background:rgba(245,241,230,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:70px;gap:16px}
.brand{display:flex;align-items:center;gap:11px;font-family:"Fraunces",serif;font-weight:600;font-size:19px}
.brand img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:9px;padding:3px;border:1px solid var(--line)}
.nav-right{display:flex;align-items:center;gap:18px}
.nav-links{display:flex;gap:24px;align-items:center}
.nav-links a{font-size:14.5px;opacity:.72;transition:opacity .2s}.nav-links a:hover{opacity:1}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-family:"IBM Plex Mono",monospace;font-size:12px}
.lang button{border:0;background:transparent;padding:6px 11px;cursor:pointer;color:var(--ink);opacity:.55;font-family:inherit}
.lang button.on{background:var(--forest);color:var(--paper);opacity:1}
.nav-cta{font-weight:600;font-size:14px;background:var(--forest);color:var(--paper);padding:9px 18px;border-radius:999px;transition:.2s}.nav-cta:hover{background:var(--ink)}
.burger{display:none;background:none;border:0;cursor:pointer;padding:6px}.burger span{display:block;width:22px;height:2px;background:var(--ink);margin:5px 0}
.hero{position:relative;background:var(--ink);color:var(--paper);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(1100px 480px at 82% -10%,rgba(92,168,41,.20),transparent 60%),radial-gradient(900px 600px at 6% 115%,rgba(46,125,79,.34),transparent 55%)}
.hero-in{position:relative;padding:88px 0 80px;display:grid;grid-template-columns:1.1fr .9fr;gap:52px;align-items:center}
.hero .eyebrow{color:var(--gold-soft)}
.hero h1{font-size:clamp(40px,5.6vw,74px);margin:20px 0 0;color:#fff}
.hero h1 em{font-style:italic;color:var(--gold);font-weight:500}
.hero p.lead{margin-top:24px;font-size:18.5px;max-width:48ch;color:rgba(245,241,230,.82)}
.hero-actions{margin-top:32px;display:flex;gap:13px;flex-wrap:wrap}
.btn-gold{background:var(--gold);color:var(--ink);font-weight:700;font-size:15px;padding:13px 24px;border-radius:999px;transition:.2s;border:0;cursor:pointer}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 14px 30px -12px rgba(212,168,67,.6)}
.btn-ghost{border:1px solid rgba(245,241,230,.35);color:var(--paper);font-weight:600;font-size:15px;padding:13px 22px;border-radius:999px;transition:.2s}
.btn-ghost:hover{border-color:var(--gold);background:rgba(212,168,67,.08)}
.hero-logo{justify-self:end;background:#fff;border-radius:22px;padding:26px;max-width:340px;width:100%;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.hero-logo img{width:100%;height:auto;display:block}
section{padding:90px 0}
.sec-head{max-width:730px;margin-bottom:48px}
.sec-head h2{font-size:clamp(30px,4vw,44px);margin-top:14px}
.sec-head p{margin-top:16px;font-size:17.5px;color:rgba(14,42,30,.72);max-width:62ch}
.thesis{background:var(--paper-2)}
.live-badge{display:inline-flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.08em;color:var(--moss);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;margin-left:12px;vertical-align:middle}
.live-stamp{margin-top:10px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--moss)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--leaf);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 24px;transition:.25s}
.kpi:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--line-gold)}
.kpi .num{font-family:"Fraunces",serif;font-size:clamp(30px,3.2vw,42px);font-weight:600;color:var(--forest)}
.kpi .lab{margin-top:8px;font-size:14px;color:rgba(14,42,30,.65)}
.kpi .sub{margin-top:3px;font-size:12px;color:var(--moss);font-family:"IBM Plex Mono",monospace}
.seg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.seg{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;transition:.25s}
.seg:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.seg .ic{width:46px;height:46px;border-radius:12px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;color:var(--forest)}
.seg h3{font-size:21px;margin-top:16px}.seg p{margin-top:8px;font-size:14.5px;color:rgba(14,42,30,.72)}
.why{background:var(--ink);color:var(--paper)}
.why .sec-head h2{color:#fff}.why .sec-head p{color:rgba(245,241,230,.72)}
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.wcard{border:1px solid rgba(245,241,230,.16);border-radius:16px;padding:26px;background:rgba(255,255,255,.02)}
.wcard .wk{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--gold-soft);letter-spacing:.14em}
.wcard h3{color:#fff;font-size:21px;margin:12px 0 8px}.wcard p{font-size:14.5px;color:rgba(245,241,230,.72)}
.contact{background:var(--ink);color:var(--paper);text-align:center}
.contact h2{font-size:clamp(30px,4.4vw,52px);color:#fff}
.contact h2 em{color:var(--gold);font-style:italic;font-weight:500}
.contact p{margin-top:16px;color:rgba(245,241,230,.75);font-size:17.5px}
.contact-actions{margin-top:32px;display:flex;gap:13px;justify-content:center;flex-wrap:wrap}
.contact-meta{margin-top:40px;display:flex;gap:12px 36px;justify-content:center;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:13px;color:rgba(245,241,230,.6)}
.contact-meta a:hover{color:var(--gold-soft)}
footer{background:#08160F;color:rgba(245,241,230,.55);padding:34px 0;font-size:13px}
.foot-in{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.foot-legal{font-family:"IBM Plex Mono",monospace;line-height:1.7}
.foot-legal b{color:var(--gold-soft);font-weight:500}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.adm-fab{position:fixed;right:18px;bottom:18px;z-index:80;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--gold-soft);border:1px solid var(--line-gold);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.35;transition:.2s}
.adm-fab:hover{opacity:1}
.adm-overlay{position:fixed;inset:0;background:rgba(8,22,15,.55);backdrop-filter:blur(3px);z-index:90;display:none;justify-content:flex-end}
.adm-overlay.open{display:flex}
.adm{width:min(560px,100%);background:var(--paper);height:100%;overflow-y:auto;box-shadow:-20px 0 60px -20px rgba(0,0,0,.5);padding:24px 24px 60px}
.adm h2{font-size:24px}.adm .adm-sub{font-size:13px;color:rgba(14,42,30,.6);margin-top:4px}
.adm-close{float:right;background:none;border:0;font-size:24px;cursor:pointer;color:var(--ink);line-height:1}
.adm-grp{margin-top:22px;border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}
.adm-grp>h3{font-size:15px;font-weight:700}
.adm-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.adm-row:first-of-type{border-top:0}
.adm-row label{font-size:12.5px;color:rgba(14,42,30,.7)}
.adm input[type=text],.adm textarea{width:100%;font-family:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.adm-full{margin-top:12px}
.adm-full label{display:block;font-size:11.5px;color:rgba(14,42,30,.6);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;font-family:"IBM Plex Mono",monospace}
.sw{position:relative;width:44px;height:24px;flex:0 0 auto}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#ccc;border-radius:999px;transition:.2s;cursor:pointer}
.sw span::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--forest)}.sw input:checked+span::before{transform:translateX(20px)}
.adm-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.adm-btn{font-size:13px;font-weight:600;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);font-family:inherit}
.adm-btn.primary{background:var(--forest);color:var(--paper);border-color:transparent}
.adm-btn.warn{color:#a33}
.adm-note{font-size:11.5px;color:rgba(14,42,30,.55);margin-top:10px;line-height:1.5}
.adm-status{font-size:12px;margin-top:8px;font-family:"IBM Plex Mono",monospace}
.kpi-edit{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;background:var(--paper)}
.kpi-edit .rowline{display:flex;gap:8px;align-items:center;margin-top:8px}
.kpi-edit .rowline:first-child{margin-top:0}
@media(max-width:960px){.hero-in{grid-template-columns:1fr;gap:36px}.hero-logo{justify-self:start;max-width:280px}.seg-grid,.why-grid{grid-template-columns:1fr}}
@media(max-width:640px){.nav-links{display:none}.burger{display:block}.nav-links.open{display:flex;position:absolute;top:70px;left:0;right:0;flex-direction:column;background:var(--paper);padding:18px 28px;gap:16px;border-bottom:1px solid var(--line)}section{padding:60px 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>

const DEFAULT={
 lang:"en",
 kpis:[
  {id:"daily",num:"2 T",lab_en:"Delivered daily",lab_fr:"Livrées chaque jour",sub_en:"since March 2026",sub_fr:"depuis mars 2026",vis:true},
  {id:"monthly",num:"52 t",lab_en:"Monthly volume",lab_fr:"Volume mensuel",sub_en:"field data",sub_fr:"données terrain",vis:true},
  {id:"clients",num:"—",lab_en:"Active clients",lab_fr:"Clients actifs",sub_en:"live · FreshLink",sub_fr:"live · FreshLink",vis:false},
  {id:"orders",num:"—",lab_en:"Orders delivered",lab_fr:"Commandes livrées",sub_en:"live · FreshLink",sub_fr:"live · FreshLink",vis:false},
  {id:"sectors",num:"—",lab_en:"Sectors covered",lab_fr:"Secteurs couverts",sub_en:"live · FreshLink",sub_fr:"live · FreshLink",vis:false}
 ],
 contact:{email:"vitafresh@vita-agro.com",vis_email:true},
 erpUrl:"https://erp.vita-agro.com/api/ext/public-stats",
 erpAuto:true,
 erpTimeoutMs:6000
};
const STORE_KEY="vf_site_v1";
let S=load();
function load(){try{const r=localStorage.getItem(STORE_KEY);if(r){const d=JSON.parse(r);const b=structuredClone(DEFAULT);if(Array.isArray(d.kpis))b.kpis=d.kpis;if(d.lang)b.lang=d.lang;if(d.contact)Object.assign(b.contact,d.contact);if(d.erpUrl!=null)b.erpUrl=d.erpUrl;if(d.erpAuto!=null)b.erpAuto=d.erpAuto;return b;}}catch(e){}return structuredClone(DEFAULT);}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function applyI18n(){
 const t=T[S.lang];document.documentElement.lang=S.lang;
 document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(t[k]!=null)el.textContent=t[k];});
 setTitle('heroTitle',t.hero_title);setTitle('contactTitle',t.contact_title);
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===S.lang));
 document.getElementById('segGrid').innerHTML=[
  ['<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>','s1'],
  ['<path d="M3 11h18M5 11V7a7 7 0 0114 0v4M8 16h.01M12 16h.01M16 16h.01"/>','s2'],
  ['<path d="M3 9l2-5h14l2 5M3 9h18v11H3zM9 20v-6h6v6"/>','s3']
 ].map(([ic,k])=>`<div class="seg"><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ic}</svg></div><h3>${esc(t[k+'h'])}</h3><p>${esc(t[k+'p'])}</p></div>`).join('');
 document.getElementById('whyGrid').innerHTML=[1,2,3].map(i=>`<div class="wcard"><div class="wk">${esc(t['w'+i+'k'])}</div><h3>${esc(t['w'+i+'h'])}</h3><p>${esc(t['w'+i+'p'])}</p></div>`).join('');
 renderKpis();renderContact();
}
function setTitle(id,str){const el=document.getElementById(id);const p=str.split('|');el.innerHTML=p.length===3?`${esc(p[0])}<br><em>${esc(p[1])}</em> ${esc(p[2])}`:p.map(esc).join('<br>');}
function renderKpis(){
 document.getElementById('kpiGrid').innerHTML=S.kpis.filter(k=>k.vis).map(k=>
  `<div class="kpi"><div class="num">${esc(k.num)}</div><div class="lab">${esc(k['lab_'+S.lang]||k.lab_en||'')}</div><div class="sub">${esc(k['sub_'+S.lang]||k.sub_en||'')}</div></div>`).join('')
  ||`<div class="kpi"><div class="lab">${S.lang==='fr'?'Chiffres bientôt disponibles.':'Figures coming soon.'}</div></div>`;
}
function renderContact(){
 const c=S.contact;const em=document.getElementById('cEmail');
 em.textContent=c.email;em.href='mailto:'+c.email;em.hidden=!c.vis_email;
 document.getElementById('contactMeta').innerHTML=`<a href="https://vita-agro.com" target="_blank" rel="noopener">vita-agro.com</a><span>Vita Fresh · ${S.lang==='fr'?'Casablanca, Maroc':'Casablanca, Morocco'}</span>`;
}
function setLang(l){S.lang=l;save();applyI18n();}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
const burger=document.getElementById('burger'),links=document.getElementById('navlinks');
burger&&burger.addEventListener('click',()=>links.classList.toggle('open'));
links&&links.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>links.classList.remove('open')));
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

/* ===== ADMIN — full KPI CRUD ===== */
const ADMIN_PASS="Jawadino";let admAuthed=false;
const overlay=document.getElementById('admOverlay'),panel=document.getElementById('admPanel');
document.getElementById('admFab').addEventListener('click',()=>{
 if(!admAuthed){const p=prompt("Admin passcode:");if(p!==ADMIN_PASS){if(p!==null)alert("Wrong passcode.");return;}admAuthed=true;}
 buildAdmin();overlay.classList.add('open');
});
overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('open');});
function buildAdmin(){
 let h=`<button class="adm-close" id="admClose">×</button><h2>Vita Fresh — Admin</h2><div class="adm-sub">Create, edit, show or hide any figure. Sync from FreshLink. Nothing shows unless you allow it.</div>`;
 h+=`<div class="adm-grp"><h3>Default language</h3><div class="adm-actions"><button class="adm-btn ${S.lang==='en'?'primary':''}" data-setlang="en">English</button><button class="adm-btn ${S.lang==='fr'?'primary':''}" data-setlang="fr">Français</button></div></div>`;
 h+=`<div class="adm-grp"><h3>Figures (KPIs)</h3><div class="adm-note">Each KPI has an <b>ID</b> (used by ERP sync), a value, labels EN/FR and a visibility switch.</div>`;
 S.kpis.forEach((k,i)=>{
  h+=`<div class="kpi-edit">
   <div class="rowline"><input type="text" data-p="${i}.id" value="${esc(k.id)}" placeholder="id" style="width:110px;font-family:'IBM Plex Mono',monospace;font-size:12px"><input type="text" data-p="${i}.num" value="${esc(k.num)}" placeholder="value" style="width:110px"><label class="sw"><input type="checkbox" data-p="${i}.vis" ${k.vis?'checked':''}><span></span></label><button class="adm-btn warn" data-del="${i}" style="margin-left:auto">✕</button></div>
   <div class="rowline"><input type="text" data-p="${i}.lab_en" value="${esc(k.lab_en||'')}" placeholder="Label (EN)"><input type="text" data-p="${i}.lab_fr" value="${esc(k.lab_fr||'')}" placeholder="Label (FR)"></div>
   <div class="rowline"><input type="text" data-p="${i}.sub_en" value="${esc(k.sub_en||'')}" placeholder="Subtitle (EN)"><input type="text" data-p="${i}.sub_fr" value="${esc(k.sub_fr||'')}" placeholder="Subtitle (FR)"></div>
  </div>`;});
 h+=`<div class="adm-actions"><button class="adm-btn primary" id="kpiAdd">+ Add a figure</button></div></div>`;
 h+=`<div class="adm-grp"><h3>Contact</h3><div class="adm-full"><label>Email</label><input type="text" data-c="email" value="${esc(S.contact.email)}"></div><div class="adm-row"><label>Show email button</label><label class="sw"><input type="checkbox" data-c="vis_email" ${S.contact.vis_email?'checked':''}><span></span></label></div></div>`;
 h+=`<div class="adm-grp"><h3>ERP sync (FreshLink)</h3><div class="adm-note">Paste a <b>read-only JSON URL</b> exposed by FreshLink (never DB credentials). Expected: <code>{"kpis":{"clients":"128","orders":"3 450"}}</code> — matches KPIs by ID and makes them visible. Unknown IDs are created automatically.</div><input type="text" id="erpUrl" style="font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:8px" placeholder="https://api.freshlink…/public/kpis.json" value="${esc(S.erpUrl||'')}"><div class="adm-row"><label>Auto-sync on page load</label><label class="sw"><input type="checkbox" id="erpAuto" ${S.erpAuto?'checked':''}><span></span></label></div><div class="adm-actions"><button class="adm-btn" id="erpFetch">Fetch from ERP</button></div><div class="adm-status" id="erpStatus"></div></div>`;
 h+=`<div class="adm-actions"><button class="adm-btn primary" id="admSave">Save</button><button class="adm-btn" id="admExport">Export JSON</button><button class="adm-btn" id="admImport">Import JSON</button><button class="adm-btn warn" id="admReset">Reset</button></div>
 <div class="adm-note">"Save" stores settings in this browser. Use Export/Import to move them or keep them after redeploys. Client-side gate — for deterrence, not vault-grade security.</div>
 <input type="file" id="admFile" accept="application/json" hidden>`;
 panel.innerHTML=h;wire();
}
function wire(){
 document.getElementById('admClose').onclick=()=>overlay.classList.remove('open');
 panel.querySelectorAll('[data-setlang]').forEach(b=>b.onclick=()=>{setLang(b.dataset.setlang);buildAdmin();});
 panel.querySelectorAll('[data-p]').forEach(inp=>{
  const ev=inp.type==='checkbox'?'change':'input';
  inp.addEventListener(ev,()=>{const[i,f]=inp.dataset.p.split('.');S.kpis[+i][f]=inp.type==='checkbox'?inp.checked:inp.value;renderKpis();});
 });
 panel.querySelectorAll('[data-c]').forEach(inp=>{
  const ev=inp.type==='checkbox'?'change':'input';
  inp.addEventListener(ev,()=>{S.contact[inp.dataset.c]=inp.type==='checkbox'?inp.checked:inp.value;renderContact();});
 });
 panel.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this figure?')){S.kpis.splice(+b.dataset.del,1);renderKpis();buildAdmin();}});
 document.getElementById('kpiAdd').onclick=()=>{S.kpis.push({id:'kpi'+(S.kpis.length+1),num:'0',lab_en:'New figure',lab_fr:'Nouveau chiffre',sub_en:'',sub_fr:'',vis:false});renderKpis();buildAdmin();};
 document.getElementById('admSave').onclick=()=>{save();flash('Saved ✓');};
 document.getElementById('admReset').onclick=()=>{if(confirm('Reset everything to defaults?')){S=structuredClone(DEFAULT);save();applyI18n();buildAdmin();}};
 document.getElementById('admExport').onclick=()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vita-fresh-config.json';a.click();};
 const f=document.getElementById('admFile');
 document.getElementById('admImport').onclick=()=>f.click();
 f.onchange=()=>{const x=f.files[0];if(!x)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(Array.isArray(d.kpis))S.kpis=d.kpis;if(d.contact)Object.assign(S.contact,d.contact);if(d.lang)S.lang=d.lang;if(d.erpUrl!=null)S.erpUrl=d.erpUrl;if(d.erpAuto!=null)S.erpAuto=d.erpAuto;save();applyI18n();buildAdmin();flash('Imported ✓');}catch(e){alert('Invalid JSON.');}};r.readAsText(x);};
 document.getElementById('erpFetch').onclick=erpFetch;
 const auto=document.getElementById('erpAuto');
 if(auto)auto.onchange=()=>{S.erpAuto=auto.checked;save();};
}
function flash(m){const s=document.getElementById('erpStatus');if(s){s.textContent=m;s.style.color='var(--forest)';setTimeout(()=>{if(s)s.textContent='';},2500);}}
async function erpFetch(){
 const url=document.getElementById('erpUrl').value.trim();const st=document.getElementById('erpStatus');
 S.erpUrl=url;save();
 if(!url){st.textContent='Enter a URL first.';st.style.color='#a33';return;}
 st.textContent='Fetching…';st.style.color='var(--moss)';
 try{
  const res=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const d=await res.json();
  if(d.kpis){for(const[id,val]of Object.entries(d.kpis)){
   let k=S.kpis.find(x=>x.id===id);
   if(k){k.num=String(val);k.vis=true;}
   else S.kpis.push({id,num:String(val),lab_en:id,lab_fr:id,sub_en:'live · FreshLink',sub_fr:'live · FreshLink',vis:true});
  }}
  save();renderKpis();buildAdmin();
  st.textContent='Synced ✓ — review, then Save.';st.style.color='var(--forest)';
 }catch(e){st.textContent='Failed: '+e.message+' (check URL / CORS).';st.style.color='#a33';}
}
applyI18n();

/* ===== ERP FreshLink — synchronisation automatique des chiffres =====
   Lecture seule : GET S.erpUrl -> {"kpis":{"<id>":"<valeur>"},"updated_at":"ISO-8601"}
   Les <id> correspondent aux id des KPI ci-dessus. En cas d'echec (ERP
   injoignable, CORS, timeout), la page conserve les valeurs statiques et
   n'affiche aucune erreur au visiteur. */
async function erpAutoSync(){
 if(!S.erpAuto||!S.erpUrl)return;
 const stamp=document.getElementById('liveStamp');
 try{
  const ctl=new AbortController();
  const to=setTimeout(()=>ctl.abort(),S.erpTimeoutMs||6000);
  const res=await fetch(S.erpUrl,{headers:{'Accept':'application/json'},signal:ctl.signal,cache:'no-store'});
  clearTimeout(to);
  if(!res.ok)throw new Error('HTTP '+res.status);
  const d=await res.json();
  if(!d||!d.kpis)throw new Error('payload');
  let n=0;
  for(const[id,val]of Object.entries(d.kpis)){
   const k=S.kpis.find(x=>x.id===id);
   if(k){k.num=String(val);k.vis=true;n++;}
  }
  if(!n)return;
  renderKpis(); // volontairement sans save() : les valeurs live ne sont pas figees dans le navigateur
  if(stamp){
   const dt=d.updated_at?new Date(d.updated_at):new Date();
   if(!isNaN(dt)){
    stamp.textContent=(S.lang==='fr'?'Chiffres synchronises depuis l\'ERP FreshLink — ':'Figures synced from the FreshLink ERP — ')
      +dt.toLocaleString(S.lang==='fr'?'fr-MA':'en-GB');
    stamp.hidden=false;
   }
  }
 }catch(e){ /* silencieux cote visiteur */ }
}
erpAutoSync();
</script>
