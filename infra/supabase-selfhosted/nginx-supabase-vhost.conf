# /etc/nginx/sites-available/db.vita-agro.com
# Reverse proxy TLS devant Kong (API gateway de la stack Supabase self-hosted).
# Kong écoute en local uniquement (127.0.0.1:8000) — ne jamais l'exposer
# directement. certbot --nginx complètera automatiquement le bloc 443/TLS.

server {
    listen 80;
    server_name db.vita-agro.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Realtime (websockets)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        client_max_body_size 50m;
    }
}
