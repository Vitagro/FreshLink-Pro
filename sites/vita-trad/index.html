<style>
:root{--ink:#0C2233;--brand:#14506B;--brand-2:#1B7A9B;--accent:#D4A843;--accent-soft:#E6C874;--paper:#F4F2EA;--paper-2:#E9E6DA;--line:rgba(0,0,0,.13);--line-accent:rgba(212,168,67,.35);--shadow:0 1px 0 rgba(0,0,0,.05),0 20px 44px -26px rgba(0,0,0,.4);--maxw:1180px}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:"Inter Tight",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}
h1,h2,h3{font-family:"Fraunces",serif;font-weight:600;line-height:1.05;letter-spacing:-.015em}
a{color:inherit;text-decoration:none}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--brand-2)}
header.nav{position:sticky;top:0;z-index:50;background:rgba(244,242,234,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:70px;gap:16px}
.brand{display:flex;align-items:center;gap:11px;font-family:"Fraunces",serif;font-weight:600;font-size:19px}
.brand img{width:38px;height:38px;object-fit:contain;background:#fff;border-radius:9px;padding:3px;border:1px solid var(--line)}
.nav-right{display:flex;align-items:center;gap:22px}
.nav-links{display:flex;gap:26px;align-items:center}
.nav-links a{font-size:14.5px;opacity:.72;transition:opacity .2s}.nav-links a:hover{opacity:1}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-family:"IBM Plex Mono",monospace;font-size:12px}
.lang button{border:0;background:transparent;padding:6px 11px;cursor:pointer;color:var(--ink);opacity:.55;font-family:inherit}
.lang button.on{background:var(--brand);color:#fff;opacity:1}
.nav-cta{font-weight:600;font-size:14px;background:var(--brand);color:#fff;padding:9px 18px;border-radius:999px;transition:background .2s,transform .2s}
.nav-cta:hover{background:var(--ink);transform:translateY(-1px)}
.burger{display:none;background:none;border:0;cursor:pointer;padding:6px}
.burger span{display:block;width:22px;height:2px;background:var(--ink);margin:5px 0}
.hero{position:relative;background:var(--ink);color:#fff;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(1100px 480px at 82% -10%,rgba(212,168,67,.16),transparent 60%),radial-gradient(900px 600px at 6% 115%,rgba(27,122,155,.32),transparent 55%)}
.hero-in{position:relative;padding:88px 0 80px;display:grid;grid-template-columns:1.12fr .88fr;gap:52px;align-items:center}
.hero .eyebrow{color:var(--accent-soft)}
.hero h1{font-size:clamp(40px,5.6vw,74px);margin:20px 0 0;color:#fff}
.hero h1 em{font-style:italic;color:var(--accent);font-weight:500}
.hero p.lead{margin-top:24px;font-size:18px;max-width:50ch;color:rgba(255,255,255,.8)}
.hero-actions{margin-top:32px;display:flex;gap:13px;flex-wrap:wrap}
.btn-gold{background:var(--accent);color:#10161a;font-weight:700;font-size:15px;padding:13px 24px;border-radius:999px;transition:transform .2s,box-shadow .2s;border:0;cursor:pointer}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 14px 30px -12px rgba(212,168,67,.35)}
.btn-ghost{border:1px solid rgba(255,255,255,.35);color:#fff;font-weight:600;font-size:15px;padding:13px 22px;border-radius:999px;transition:border-color .2s,background .2s}
.btn-ghost:hover{border-color:var(--accent);background:rgba(255,255,255,.06)}
.hero-logo{justify-self:end;background:#fff;border-radius:22px;padding:34px;max-width:340px;width:100%;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.hero-logo img{width:100%;height:auto;display:block}
section{padding:88px 0}
.sec-head{max-width:730px;margin-bottom:46px}
.sec-head h2{font-size:clamp(28px,4vw,44px);margin-top:14px}
.sec-head p{margin-top:16px;font-size:17.5px;opacity:.72;max-width:62ch}
.thesis{background:var(--paper-2)}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--paper)}
.kpi{padding:30px 24px;border-right:1px solid var(--line)}.kpi:last-child{border-right:0}
.kpi .num{font-family:"Fraunces",serif;font-size:clamp(28px,3.2vw,42px);font-weight:600;color:var(--brand)}
.kpi .lab{margin-top:8px;font-size:14px;opacity:.66}
.kpi .sub{margin-top:3px;font-size:12.5px;color:var(--brand-2);font-family:"IBM Plex Mono",monospace}
.seg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.seg{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;transition:transform .25s,box-shadow .25s,border-color .25s}
.seg:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--line-accent)}
.seg .ic{width:46px;height:46px;border-radius:12px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;color:var(--brand)}
.seg h3{font-size:21px;margin-top:16px}.seg p{margin-top:8px;font-size:14.5px;opacity:.72}
.seg ul{margin-top:12px;padding-left:18px;font-size:14px;opacity:.72}
.seg li{margin-top:5px}
.why{background:var(--ink);color:#fff}
.why .sec-head h2{color:#fff}.why .sec-head p{color:rgba(255,255,255,.72)}
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.wcard{border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:26px;background:rgba(255,255,255,.03)}
.wcard .wk{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--accent-soft);letter-spacing:.14em}
.wcard h3{color:#fff;font-size:21px;margin:12px 0 8px}.wcard p{font-size:14.5px;color:rgba(255,255,255,.72)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.step{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:14px;padding:24px;background:var(--paper-2)}
.step .sk{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--brand-2);letter-spacing:.1em}
.step h3{font-size:19px;margin:8px 0 6px}.step p{font-size:14px;opacity:.72}
.contact{background:var(--ink);color:#fff;text-align:center}
.contact h2{font-size:clamp(30px,4.4vw,52px);color:#fff}
.contact h2 em{color:var(--accent);font-style:italic;font-weight:500}
.contact p{margin-top:16px;color:rgba(255,255,255,.75);font-size:17.5px}
.contact-actions{margin-top:32px;display:flex;gap:13px;justify-content:center;flex-wrap:wrap}
.contact-meta{margin-top:40px;display:flex;gap:12px 36px;justify-content:center;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:13px;color:rgba(255,255,255,.6)}
.contact-meta a:hover{color:var(--accent-soft)}
footer{background:#081724;color:rgba(255,255,255,.55);padding:34px 0;font-size:13px}
.foot-in{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.foot-legal{font-family:"IBM Plex Mono",monospace;line-height:1.7}
.foot-legal b{color:var(--accent-soft);font-weight:500}
.foot-brands{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.foot-brands a{opacity:.75}.foot-brands a:hover{opacity:1;color:var(--accent-soft)}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
@media(max-width:960px){.hero-in{grid-template-columns:1fr;gap:36px}.hero-logo{justify-self:start;max-width:260px}.seg-grid,.why-grid{grid-template-columns:1fr}.kpi-grid,.steps{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.nav-links{display:none}.burger{display:block}.nav-links.open{display:flex;position:absolute;top:70px;left:0;right:0;flex-direction:column;background:var(--paper);padding:18px 28px;gap:16px;border-bottom:1px solid var(--line)}section{padding:60px 0}.kpi-grid,.steps{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
