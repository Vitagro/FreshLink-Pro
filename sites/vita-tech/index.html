<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vita Tech — IT Solutions & Innovation · Casablanca</title>
<meta name="description" content="Vita Tech — software publisher of the Vita Agro Capital group. Proprietary AI-powered platforms for the supply chain.">

<style>
:root{--ink:#0B1C33;--navy:#123A66;--blue:#1F6FD6;--sky:#2B9BF4;--cyan:#7CC5FF;--paper:#F2F5FA;--paper-2:#E7EDF5;--line:rgba(11,28,51,.14);--line-blue:rgba(43,155,244,.35);--shadow:0 1px 0 rgba(11,28,51,.05),0 20px 44px -26px rgba(11,28,51,.4);--maxw:1180px}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:"Inter Tight",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}
h1,h2,h3{font-family:"Fraunces",serif;font-weight:600;line-height:1.04;letter-spacing:-.015em}
a{color:inherit;text-decoration:none}[hidden]{display:none!important}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--blue)}
header.nav{position:sticky;top:0;z-index:50;background:rgba(242,245,250,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:70px;gap:16px}
.brand{display:flex;align-items:center;gap:11px;font-family:"Fraunces",serif;font-weight:600;font-size:19px}
.brand img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:9px;padding:3px;border:1px solid var(--line)}
.nav-right{display:flex;align-items:center;gap:18px}
.nav-links{display:flex;gap:24px;align-items:center}
.nav-links a{font-size:14.5px;opacity:.72;transition:opacity .2s}.nav-links a:hover{opacity:1}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-family:"IBM Plex Mono",monospace;font-size:12px}
.lang button{border:0;background:transparent;padding:6px 11px;cursor:pointer;color:var(--ink);opacity:.55;font-family:inherit}
.lang button.on{background:var(--navy);color:#fff;opacity:1}
.nav-cta{font-weight:600;font-size:14px;background:var(--navy);color:#fff;padding:9px 18px;border-radius:999px;transition:.2s}.nav-cta:hover{background:var(--ink)}
.burger{display:none;background:none;border:0;cursor:pointer;padding:6px}.burger span{display:block;width:22px;height:2px;background:var(--ink);margin:5px 0}
.hero{position:relative;background:var(--ink);color:#EAF2FC;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(1100px 480px at 82% -10%,rgba(43,155,244,.22),transparent 60%),radial-gradient(900px 600px at 6% 115%,rgba(31,111,214,.30),transparent 55%)}
.hero-in{position:relative;padding:88px 0 80px;display:grid;grid-template-columns:1.1fr .9fr;gap:52px;align-items:center}
.hero .eyebrow{color:var(--cyan)}
.hero h1{font-size:clamp(40px,5.6vw,74px);margin:20px 0 0;color:#fff}
.hero h1 em{font-style:italic;color:var(--sky);font-weight:500}
.hero p.lead{margin-top:24px;font-size:18.5px;max-width:48ch;color:rgba(234,242,252,.82)}
.hero-actions{margin-top:32px;display:flex;gap:13px;flex-wrap:wrap}
.btn-blue{background:var(--sky);color:#04182e;font-weight:700;font-size:15px;padding:13px 24px;border-radius:999px;transition:.2s;border:0;cursor:pointer}
.btn-blue:hover{transform:translateY(-2px);box-shadow:0 14px 30px -12px rgba(43,155,244,.6)}
.btn-ghost{border:1px solid rgba(234,242,252,.35);color:#EAF2FC;font-weight:600;font-size:15px;padding:13px 22px;border-radius:999px;transition:.2s}
.btn-ghost:hover{border-color:var(--sky);background:rgba(43,155,244,.08)}
.hero-logo{justify-self:end;background:#fff;border-radius:22px;padding:30px;max-width:340px;width:100%;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.hero-logo img{width:100%;height:auto;display:block}
section{padding:90px 0}
.sec-head{max-width:730px;margin-bottom:48px}
.sec-head h2{font-size:clamp(30px,4vw,44px);margin-top:14px}
.sec-head p{margin-top:16px;font-size:17.5px;color:rgba(11,28,51,.72);max-width:62ch}
.thesis{background:var(--paper-2)}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.app{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;transition:.25s}
.app-screenshot{width:100%;border-radius:10px;border:1px solid var(--line);margin-bottom:14px;display:block}
.app:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--line-blue)}
.app-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.app-ic{width:46px;height:46px;border-radius:12px;background:linear-gradient(140deg,var(--navy),var(--sky));color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Fraunces",serif;font-size:20px;font-weight:600;flex:0 0 auto}
.badge{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;padding:5px 10px;border-radius:999px;white-space:nowrap;text-transform:uppercase}
.badge.live{background:#E7F6EC;color:#1B7A3D}.badge.beta{background:#EAF3FF;color:var(--blue)}.badge.soon{background:var(--paper-2);color:rgba(11,28,51,.6)}
.app h3{font-size:21px;margin-top:16px}
.app .cat{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.05em;color:var(--blue);margin-top:4px;text-transform:uppercase}
.app p{margin-top:12px;font-size:14.5px;color:rgba(11,28,51,.72);flex:1 0 auto}
.app .app-link{margin-top:16px;padding-top:13px;border-top:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--blue);font-weight:500}
.app .app-link:hover{color:var(--sky)}
.app .mobile{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.mobile-badge{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;padding:6px 10px;border-radius:8px;text-decoration:none;display:inline-flex;align-items:center;gap:5px;letter-spacing:.02em;border:1px solid transparent}
.mobile-badge.android{background:#E7F6EC;color:#1B7A3D;border-color:rgba(27,122,61,.25)}
.mobile-badge.android:hover{background:#d7f0e0}
.mobile-badge.ios-soon{background:var(--paper-2);color:rgba(11,28,51,.55);border-color:var(--line)}
.model-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.mcard{border:1px solid rgba(234,242,252,.16);border-radius:16px;padding:26px;background:rgba(255,255,255,.03)}
.mcard .mk{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--cyan);letter-spacing:.14em}
.mcard h3{color:#fff;font-size:21px;margin:12px 0 8px}.mcard p{font-size:14.5px;color:rgba(234,242,252,.72)}
.dark{background:var(--ink);color:#EAF2FC}
.dark .sec-head h2{color:#fff}.dark .sec-head p{color:rgba(234,242,252,.72)}
.contact{background:var(--ink);color:#EAF2FC;text-align:center}
.contact h2{font-size:clamp(30px,4.4vw,52px);color:#fff}
.contact h2 em{color:var(--sky);font-style:italic;font-weight:500}
.contact p{margin-top:16px;color:rgba(234,242,252,.75);font-size:17.5px}
.contact-actions{margin-top:32px;display:flex;gap:13px;justify-content:center;flex-wrap:wrap}
.contact-meta{margin-top:40px;display:flex;gap:12px 36px;justify-content:center;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:13px;color:rgba(234,242,252,.6)}
.contact-meta a:hover{color:var(--cyan)}
footer{background:#050F1E;color:rgba(234,242,252,.55);padding:34px 0;font-size:13px}
.foot-in{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.foot-legal{font-family:"IBM Plex Mono",monospace;line-height:1.7}
.foot-legal b{color:var(--cyan);font-weight:500}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.adm-fab{position:fixed;right:18px;bottom:18px;z-index:80;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--cyan);border:1px solid var(--line-blue);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.35;transition:.2s}
.adm-fab:hover{opacity:1}
.adm-overlay{position:fixed;inset:0;background:rgba(5,15,30,.55);backdrop-filter:blur(3px);z-index:90;display:none;justify-content:flex-end}
.qr-overlay{position:fixed;inset:0;background:rgba(5,15,30,.6);backdrop-filter:blur(3px);z-index:95;display:none;align-items:center;justify-content:center;padding:20px}
.qr-overlay.open{display:flex}
.qr-modal{background:#fff;border-radius:16px;padding:28px;max-width:340px;width:100%;text-align:center;box-shadow:var(--shadow)}
.qr-modal h3{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:4px;font-family:'Fraunces',serif}
.qr-modal p{font-size:12px;color:rgba(11,28,51,.6);margin-bottom:16px;line-height:1.5}
.qr-box{display:inline-block;padding:10px;background:#fff;border:1px solid var(--line);border-radius:10px;line-height:0;margin-bottom:14px}
.qr-modal a.qr-dl{display:inline-block;padding:10px 18px;border-radius:9px;background:var(--navy);color:#fff;font-weight:700;font-size:13px;text-decoration:none}
.qr-modal button.qr-close{margin-top:12px;display:block;width:100%;background:none;border:none;color:rgba(11,28,51,.5);font-size:12px;cursor:pointer;font-family:inherit}
.adm-overlay.open{display:flex}
.adm{width:min(560px,100%);background:var(--paper);height:100%;overflow-y:auto;box-shadow:-20px 0 60px -20px rgba(0,0,0,.5);padding:24px 24px 60px}
.adm h2{font-size:24px}.adm .adm-sub{font-size:13px;color:rgba(11,28,51,.6);margin-top:4px}
.adm-close{float:right;background:none;border:0;font-size:24px;cursor:pointer;color:var(--ink);line-height:1}
.adm-grp{margin-top:22px;border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}
.adm-grp>h3{font-size:15px;font-weight:700}
.adm-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.adm-row:first-of-type{border-top:0}
.adm-row label{font-size:12.5px;color:rgba(11,28,51,.7)}
.adm input[type=text],.adm textarea,.adm select{width:100%;font-family:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
textarea{resize:vertical;min-height:52px}
.adm-full{margin-top:12px}
.adm-full label{display:block;font-size:11.5px;color:rgba(11,28,51,.6);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;font-family:"IBM Plex Mono",monospace}
.sw{position:relative;width:44px;height:24px;flex:0 0 auto}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#ccc;border-radius:999px;transition:.2s;cursor:pointer}
.sw span::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--navy)}.sw input:checked+span::before{transform:translateX(20px)}
.adm-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.adm-btn{font-size:13px;font-weight:600;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);font-family:inherit}
.adm-btn.primary{background:var(--navy);color:#fff;border-color:transparent}
.adm-btn.warn{color:#a33}
.adm-note{font-size:11.5px;color:rgba(11,28,51,.55);margin-top:10px;line-height:1.5}
.adm-status{font-size:12px;margin-top:8px;font-family:"IBM Plex Mono",monospace}
.app-edit{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;background:var(--paper)}
.app-edit .rowline{display:flex;gap:8px;align-items:center;margin-top:8px}
.app-edit .rowline:first-child{margin-top:0}
@media(max-width:960px){.hero-in{grid-template-columns:1fr;gap:36px}.hero-logo{justify-self:start;max-width:280px}.model-grid{grid-template-columns:1fr}}
@media(max-width:640px){.nav-links{display:none}.burger{display:block}.nav-links.open{display:flex;position:absolute;top:70px;left:0;right:0;flex-direction:column;background:var(--paper);padding:18px 28px;gap:16px;border-bottom:1px solid var(--line)}section{padding:60px 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

const STORE_KEY="vt_site_v1";
let S=load();
function load(){try{const r=localStorage.getItem(STORE_KEY);if(r){const d=JSON.parse(r);const b=structuredClone(DEFAULT);if(Array.isArray(d.apps))b.apps=d.apps;if(d.lang)b.lang=d.lang;if(d.contact)Object.assign(b.contact,d.contact);if(d.dbUrl!=null)b.dbUrl=d.dbUrl;return b;}}catch(e){}return structuredClone(DEFAULT);}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function applyI18n(){
 const t=T[S.lang];document.documentElement.lang=S.lang;
 document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(t[k]!=null)el.textContent=t[k];});
 setTitle('heroTitle',t.hero_title);setTitle('contactTitle',t.contact_title);
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===S.lang));
 document.getElementById('modelGrid').innerHTML=[1,2,3].map(i=>`<div class="mcard"><div class="mk">${esc(t['m'+i+'k'])}</div><h3>${esc(t['m'+i+'h'])}</h3><p>${esc(t['m'+i+'p'])}</p></div>`).join('');
 renderApps();renderContact();
}
function setTitle(id,str){const el=document.getElementById(id);const p=str.split('|');el.innerHTML=p.length===3?`${esc(p[0])}<br><em>${esc(p[1])}</em> ${esc(p[2])}`:p.map(esc).join('<br>');}
function renderApps(){
 const t=T[S.lang];
 document.getElementById('appsGrid').innerHTML=S.apps.filter(a=>a.vis).map(a=>{
  const st=a.status==='live'?['live',t.st_live]:a.status==='beta'?['beta',t.st_beta]:['soon',t.st_soon];
  const link=a.url?`<a class="app-link" href="${esc(a.url)}" target="_blank" rel="noopener">${S.lang==='fr'?'Découvrir':'Learn more'} →</a>`:'';
  const initial=esc((a.name||'?').charAt(0).toUpperCase());
  const mobile=(a.androidUrl||a.iosSoon)?`<div class="mobile">${a.androidUrl?`<a class="mobile-badge android" href="#" data-apk="${esc(a.androidUrl)}">🤖 Android</a>`:''}${a.iosSoon?`<span class="mobile-badge ios-soon">🍎 iOS — ${S.lang==='fr'?'Bientôt':'Coming soon'}</span>`:''}</div>`:'';
  const shot=a.screenshot?`<img class="app-screenshot" src="${a.screenshot}" alt="${esc(a.name)} screenshot" loading="lazy">`:'';
  return `<article class="app">${shot}<div class="app-top"><div class="app-ic">${initial}</div><span class="badge ${st[0]}">${esc(st[1])}</span></div><h3>${esc(a.name)}</h3><div class="cat">${esc(a['cat_'+S.lang]||a.cat_en||'')}</div><p>${esc(a['desc_'+S.lang]||a.desc_en||'')}</p>${mobile}${link}</article>`;
 }).join('')||`<article class="app"><p>${S.lang==='fr'?'Catalogue en cours de publication.':'Catalogue being published.'}</p></article>`;
}
function renderContact(){
 const c=S.contact;const em=document.getElementById('cEmail');
 em.textContent=c.email;em.href='mailto:'+c.email;em.hidden=!c.vis_email;
 document.getElementById('contactMeta').innerHTML=`<a href="https://vita-agro.com" target="_blank" rel="noopener">vita-agro.com</a><span>Vita Tech · ${S.lang==='fr'?'Casablanca, Maroc':'Casablanca, Morocco'}</span>`;
}
function setLang(l){S.lang=l;save();applyI18n();}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
const burger=document.getElementById('burger'),links=document.getElementById('navlinks');
burger&&burger.addEventListener('click',()=>links.classList.toggle('open'));
links&&links.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>links.classList.remove('open')));
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

/* ===== ADMIN — application database CRUD ===== */
const ADMIN_PASS="Jawadino";let admAuthed=false;
const overlay=document.getElementById('admOverlay'),panel=document.getElementById('admPanel');
document.getElementById('admFab').addEventListener('click',()=>{
 if(!admAuthed){const p=prompt("Admin passcode:");if(p!==ADMIN_PASS){if(p!==null)alert("Wrong passcode.");return;}admAuthed=true;}
 buildAdmin();overlay.classList.add('open');
});
overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('open');});

/* ===== APK download gate — password required before opening the file =====
   Shared password communicated by the team case-by-case; change APK_PASS
   below to rotate it (client-side gate — deterrence, not vault-grade). */
const APK_PASS="vita@2026";
document.addEventListener('click',e=>{
 const a=e.target.closest('.mobile-badge.android[data-apk]');
 if(!a)return;
 e.preventDefault();
 const p=prompt(S.lang==='fr'?"Mot de passe requis pour télécharger l'APK :":"Password required to download the APK:");
 if(p===null)return;
 if(p!==APK_PASS){alert(S.lang==='fr'?"Mot de passe incorrect.":"Incorrect password.");return;}
 showApkQr(a.dataset.apk);
});
function showApkQr(url){
 const modal=document.getElementById('qrModal');
 modal.innerHTML=`<h3>${S.lang==='fr'?'Scannez pour installer':'Scan to install'}</h3><p>${S.lang==='fr'?"Ou ouvrez ce lien directement sur le téléphone.":"Or open this link directly on the phone."}</p><div class="qr-box" id="qrBox"></div><a class="qr-dl" href="${esc(url)}" target="_blank" rel="noopener">${S.lang==='fr'?'Télécharger':'Download'}</a><button class="qr-close" id="qrClose">${S.lang==='fr'?'Fermer':'Close'}</button>`;
 try{
  const qr=qrcode(0,'M');qr.addData(url);qr.make();
  document.getElementById('qrBox').innerHTML=qr.createSvgTag({cellSize:5,margin:4});
 }catch(e){document.getElementById('qrBox').innerHTML='<p style="font-size:11px;color:#c0392b">QR indisponible — utilisez le lien.</p>';}
 document.getElementById('qrClose').onclick=()=>document.getElementById('qrOverlay').classList.remove('open');
 document.getElementById('qrOverlay').classList.add('open');
}
document.getElementById('qrOverlay').addEventListener('click',e=>{if(e.target.id==='qrOverlay')e.currentTarget.classList.remove('open');});
function buildAdmin(){
 let h=`<button class="adm-close" id="admClose">×</button><h2>Vita Tech — Admin</h2><div class="adm-sub">Manage your application catalogue: add, edit, publish or hide. Sync from your app database endpoint.</div>`;
 h+=`<div class="adm-grp"><h3>Default language</h3><div class="adm-actions"><button class="adm-btn ${S.lang==='en'?'primary':''}" data-setlang="en">English</button><button class="adm-btn ${S.lang==='fr'?'primary':''}" data-setlang="fr">Français</button></div></div>`;
 h+=`<div class="adm-grp"><h3>Applications</h3><div class="adm-note">Each app has an <b>ID</b> (used by sync), a status (live / beta / soon), labels EN/FR, an optional link, and a visibility switch.</div>`;
 S.apps.forEach((a,i)=>{
  h+=`<div class="app-edit">
   <div class="rowline"><input type="text" data-p="${i}.id" value="${esc(a.id)}" placeholder="id" style="width:100px;font-family:'IBM Plex Mono',monospace;font-size:12px"><input type="text" data-p="${i}.name" value="${esc(a.name)}" placeholder="Name"><select data-p="${i}.status" style="width:96px"><option value="live" ${a.status==='live'?'selected':''}>live</option><option value="beta" ${a.status==='beta'?'selected':''}>beta</option><option value="soon" ${a.status==='soon'?'selected':''}>soon</option></select><label class="sw"><input type="checkbox" data-p="${i}.vis" ${a.vis?'checked':''}><span></span></label><button class="adm-btn warn" data-del="${i}">✕</button></div>
   <div class="rowline"><input type="text" data-p="${i}.cat_en" value="${esc(a.cat_en||'')}" placeholder="Category (EN)"><input type="text" data-p="${i}.cat_fr" value="${esc(a.cat_fr||'')}" placeholder="Catégorie (FR)"></div>
   <div class="rowline"><textarea data-p="${i}.desc_en" placeholder="Description (EN)">${esc(a.desc_en||'')}</textarea></div>
   <div class="rowline"><textarea data-p="${i}.desc_fr" placeholder="Description (FR)">${esc(a.desc_fr||'')}</textarea></div>
   <div class="rowline"><input type="text" data-p="${i}.url" value="${esc(a.url||'')}" placeholder="https:// link (optional)" style="font-family:'IBM Plex Mono',monospace;font-size:12px"></div>
  </div>`;});
 h+=`<div class="adm-actions"><button class="adm-btn primary" id="appAdd">+ Add an application</button></div></div>`;
 h+=`<div class="adm-grp"><h3>Contact</h3><div class="adm-full"><label>Email</label><input type="text" data-c="email" value="${esc(S.contact.email)}"></div><div class="adm-row"><label>Show email button</label><label class="sw"><input type="checkbox" data-c="vis_email" ${S.contact.vis_email?'checked':''}><span></span></label></div></div>`;
 h+=`<div class="adm-grp"><h3>App database sync</h3><div class="adm-note">Paste a <b>read-only JSON URL</b> that lists your applications (from FreshLink/Supabase via a public view, or any endpoint). Expected: <code>{"apps":[{"id":"…","name":"…","status":"live","desc_en":"…","desc_fr":"…"}]}</code>. Existing IDs are updated, new IDs are added (hidden by default so you review them first). Never expose database credentials.</div><input type="text" id="dbUrl" style="font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:8px" placeholder="https://…/public/apps.json" value="${esc(S.dbUrl||'')}"><div class="adm-actions"><button class="adm-btn" id="dbFetch">Sync catalogue</button></div><div class="adm-status" id="dbStatus"></div></div>`;
 h+=`<div class="adm-actions"><button class="adm-btn primary" id="admSave">Save</button><button class="adm-btn" id="admExport">Export JSON</button><button class="adm-btn" id="admImport">Import JSON</button><button class="adm-btn warn" id="admReset">Reset</button></div>
 <div class="adm-note">"Save" stores settings in this browser. Use Export/Import to keep them across deployments. Client-side gate — for deterrence, not vault-grade security.</div>
 <input type="file" id="admFile" accept="application/json" hidden>`;
 panel.innerHTML=h;wire();
}
function wire(){
 document.getElementById('admClose').onclick=()=>overlay.classList.remove('open');
 panel.querySelectorAll('[data-setlang]').forEach(b=>b.onclick=()=>{setLang(b.dataset.setlang);buildAdmin();});
 panel.querySelectorAll('[data-p]').forEach(inp=>{
  const ev=(inp.type==='checkbox'||inp.tagName==='SELECT')?'change':'input';
  inp.addEventListener(ev,()=>{const[i,f]=inp.dataset.p.split('.');S.apps[+i][f]=inp.type==='checkbox'?inp.checked:inp.value;renderApps();});
 });
 panel.querySelectorAll('[data-c]').forEach(inp=>{
  const ev=inp.type==='checkbox'?'change':'input';
  inp.addEventListener(ev,()=>{S.contact[inp.dataset.c]=inp.type==='checkbox'?inp.checked:inp.value;renderContact();});
 });
 panel.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this application?')){S.apps.splice(+b.dataset.del,1);renderApps();buildAdmin();}});
 document.getElementById('appAdd').onclick=()=>{S.apps.push({id:'app'+(S.apps.length+1),name:'New application',cat_en:'',cat_fr:'',status:'soon',url:'',vis:false,desc_en:'',desc_fr:''});renderApps();buildAdmin();};
 document.getElementById('admSave').onclick=()=>{save();flash('Saved ✓');};
 document.getElementById('admReset').onclick=()=>{if(confirm('Reset everything to defaults?')){S=structuredClone(DEFAULT);save();applyI18n();buildAdmin();}};
 document.getElementById('admExport').onclick=()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vita-tech-config.json';a.click();};
 const f=document.getElementById('admFile');
 document.getElementById('admImport').onclick=()=>f.click();
 f.onchange=()=>{const x=f.files[0];if(!x)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(Array.isArray(d.apps))S.apps=d.apps;if(d.contact)Object.assign(S.contact,d.contact);if(d.lang)S.lang=d.lang;if(d.dbUrl!=null)S.dbUrl=d.dbUrl;save();applyI18n();buildAdmin();flash('Imported ✓');}catch(e){alert('Invalid JSON.');}};r.readAsText(x);};
 document.getElementById('dbFetch').onclick=dbFetch;
}
function flash(m){const s=document.getElementById('dbStatus');if(s){s.textContent=m;s.style.color='var(--navy)';setTimeout(()=>{if(s)s.textContent='';},2500);}}
async function dbFetch(){
 const url=document.getElementById('dbUrl').value.trim();const st=document.getElementById('dbStatus');
 S.dbUrl=url;save();
 if(!url){st.textContent='Enter a URL first.';st.style.color='#a33';return;}
 st.textContent='Syncing…';st.style.color='var(--blue)';
 try{
  const res=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const d=await res.json();
  if(Array.isArray(d.apps)){
   let added=0,updated=0;
   d.apps.forEach(inc=>{
    if(!inc||!inc.id)return;
    let a=S.apps.find(x=>x.id===inc.id);
    if(a){Object.assign(a,inc);updated++;}
    else{S.apps.push(Object.assign({vis:false,status:'soon',url:'',cat_en:'',cat_fr:'',desc_en:'',desc_fr:'',name:inc.id},inc));added++;}
   });
   save();renderApps();buildAdmin();
   st.textContent=`Synced ✓ — ${updated} updated, ${added} added (hidden). Review, then Save.`;st.style.color='var(--navy)';
  }else{st.textContent='No "apps" array found in response.';st.style.color='#a33';}
 }catch(e){st.textContent='Failed: '+e.message+' (check URL / CORS).';st.style.color='#a33';}
}
applyI18n();
</script>
