name: CI

# Filet de sécurité avant déploiement Vercel : vérifie que le workspace
# compile (typecheck) et build correctement sur chaque PR et push vers main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm -r --if-present run build

      - name: Security and order regression tests
        run: node --test --test-isolation=none tests/security.mjs

      - name: Catalogue regression tests
        run: node --test --test-isolation=none artifacts/api-server/src/lib/ext/catalogueView.test.mjs

      - name: Backup pagination regression test
        run: node tests/backup.mjs

      - name: Controlled order import regression tests
        run: node scripts/order-batch.test.mjs

      - name: AI connection regression tests
        run: node scripts/ai-client.test.mjs

      - name: AI server regression tests
        run: node scripts/ai-server.test.mjs

      - name: Dashboard metric regression tests
        run: node scripts/dashboard-metrics.test.mjs
