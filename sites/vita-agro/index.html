<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vita Agro Capital — Agri-tech holding · Casablanca</title>
<meta name="description" content="Vita Agro Capital — a Moroccan agri-tech holding. One profitable root, five growth branches.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,900&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E2A1E;--forest:#1E5631;--moss:#2E7D4F;--gold:#D4A843;--gold-soft:#E6C874;
    --paper:#F5F1E6;--paper-2:#EDE7D6;--white:#FFFFFF;
    --line:rgba(14,42,30,.14);--line-gold:rgba(212,168,67,.35);
    --shadow:0 1px 0 rgba(14,42,30,.05),0 20px 44px -26px rgba(14,42,30,.4);
    --maxw:1180px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Inter Tight",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}
  h1,h2,h3{font-family:"Fraunces",serif;font-weight:600;line-height:1.04;letter-spacing:-.015em}
  a{color:inherit;text-decoration:none}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--moss)}
  [hidden]{display:none!important}

  header.nav{position:sticky;top:0;z-index:50;background:rgba(245,241,230,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:70px;gap:16px}
  .brand{display:flex;align-items:center;gap:11px;font-family:"Fraunces",serif;font-weight:600;font-size:19px}
  .brand img{width:38px;height:38px;object-fit:contain;background:#fff;border-radius:9px;padding:3px;border:1px solid var(--line)}
  .nav-right{display:flex;align-items:center;gap:22px}
  .nav-links{display:flex;gap:26px;align-items:center}
  .nav-links a{font-size:14.5px;opacity:.72;transition:opacity .2s}
  .nav-links a:hover{opacity:1}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-family:"IBM Plex Mono",monospace;font-size:12px}
  .lang button{border:0;background:transparent;padding:6px 11px;cursor:pointer;color:var(--ink);opacity:.55;font-family:inherit}
  .lang button.on{background:var(--forest);color:var(--paper);opacity:1}
  .nav-cta{font-weight:600;font-size:14px;background:var(--forest);color:var(--paper);padding:9px 18px;border-radius:999px;transition:background .2s,transform .2s}
  .nav-cta:hover{background:var(--ink);transform:translateY(-1px)}
  .burger{display:none;background:none;border:0;cursor:pointer;padding:6px}
  .burger span{display:block;width:22px;height:2px;background:var(--ink);margin:5px 0}

  .hero{position:relative;background:var(--ink);color:var(--paper);overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;background:radial-gradient(1100px 480px at 82% -10%,rgba(212,168,67,.16),transparent 60%),radial-gradient(900px 600px at 6% 115%,rgba(46,125,79,.32),transparent 55%)}
  .hero-in{position:relative;padding:92px 0 84px;display:grid;grid-template-columns:1.12fr .88fr;gap:52px;align-items:center}
  .hero .eyebrow{color:var(--gold-soft)}
  .hero h1{font-size:clamp(42px,6vw,80px);margin:20px 0 0;color:#fff}
  .hero h1 em{font-style:italic;color:var(--gold);font-weight:500}
  .hero p.lead{margin-top:24px;font-size:18.5px;max-width:48ch;color:rgba(245,241,230,.82)}
  .motto{margin-top:22px;display:flex;gap:10px 22px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft)}
  .motto span{display:flex;align-items:center;gap:10px}
  .motto span::before{content:"";width:6px;height:6px;background:var(--gold);border-radius:50%}
  .hero-actions{margin-top:32px;display:flex;gap:13px;flex-wrap:wrap}
  .btn-gold{background:var(--gold);color:var(--ink);font-weight:700;font-size:15px;padding:13px 24px;border-radius:999px;transition:transform .2s,box-shadow .2s;cursor:pointer;border:0}
  .btn-gold:hover{transform:translateY(-2px);box-shadow:0 14px 30px -12px rgba(212,168,67,.6)}
  .btn-ghost{border:1px solid rgba(245,241,230,.35);color:var(--paper);font-weight:600;font-size:15px;padding:13px 22px;border-radius:999px;transition:border-color .2s,background .2s}
  .btn-ghost:hover{border-color:var(--gold);background:rgba(212,168,67,.08)}
  .hero-logo{justify-self:end;background:#fff;border-radius:22px;padding:34px;max-width:360px;width:100%;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
  .hero-logo img{width:100%;height:auto;display:block}

  .ticker{border-top:1px solid rgba(245,241,230,.12);border-bottom:1px solid rgba(245,241,230,.12);background:rgba(0,0,0,.18)}
  .ticker-row{display:flex;gap:50px;padding:15px 0;white-space:nowrap;animation:scroll 34s linear infinite;width:max-content}
  .ticker-row span{font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.12em;color:rgba(245,241,230,.6);text-transform:uppercase}
  .ticker-row b{color:var(--gold-soft);font-weight:500}
  @keyframes scroll{to{transform:translateX(-50%)}}

  section{padding:94px 0}
  .sec-head{max-width:730px;margin-bottom:50px}
  .sec-head h2{font-size:clamp(30px,4vw,46px);margin-top:14px}
  .sec-head p{margin-top:16px;font-size:18px;color:rgba(14,42,30,.72);max-width:62ch}

  .thesis{background:var(--paper-2)}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--paper)}
  .stat{padding:32px 26px;border-right:1px solid var(--line)}
  .stat:last-child{border-right:0}
  .stat .num{font-family:"Fraunces",serif;font-size:clamp(30px,3.4vw,44px);font-weight:600;color:var(--forest)}
  .stat .num small{font-size:.5em;color:var(--gold);font-weight:600;font-family:"IBM Plex Mono",monospace}
  .stat .lab{margin-top:8px;font-size:14px;color:rgba(14,42,30,.62)}
  .stat .sub{margin-top:3px;font-size:12.5px;color:var(--moss);font-family:"IBM Plex Mono",monospace}

  .subs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .sub{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s,border-color .25s}
  .sub:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--line-gold)}
  .sub-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .logo-tile{width:104px;height:104px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:8px;flex:0 0 auto}
  .logo-tile img{max-width:100%;max-height:100%;object-fit:contain}
  .phase{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.05em;color:var(--moss);background:var(--paper-2);padding:5px 10px;border-radius:999px;white-space:nowrap}
  .sub h3{font-size:24px;margin-top:18px}
  .sub-tag{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.05em;color:var(--gold);margin-top:5px;text-transform:uppercase}
  .sub-mission{margin-top:14px;font-size:14.5px;line-height:1.55;color:rgba(14,42,30,.75)}
  .sub-link{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--forest);font-weight:500;transition:color .2s}
  .sub-link:hover{color:var(--gold)}
  .sub{justify-content:flex-start}
  .sub .sub-mission{flex:1 0 auto}

  .model{background:var(--ink);color:var(--paper)}
  .model .sec-head h2{color:#fff}
  .model .sec-head p{color:rgba(245,241,230,.72)}
  .model-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:8px}
  .mstep{border:1px solid rgba(245,241,230,.16);border-radius:16px;padding:26px;background:rgba(255,255,255,.02)}
  .mstep .mk{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--gold-soft);letter-spacing:.14em}
  .mstep h3{color:#fff;font-size:22px;margin:12px 0 8px}
  .mstep p{font-size:14.5px;color:rgba(245,241,230,.72)}

  .amb-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .amb{background:var(--paper-2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:14px;padding:26px}
  .amb .ak{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--moss);letter-spacing:.1em}
  .amb h3{font-size:22px;margin:8px 0 8px}
  .amb p{font-size:15px;color:rgba(14,42,30,.72)}

  .fund-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .fund{border:1px solid var(--line);border-radius:16px;padding:30px;background:var(--paper-2)}
  .fund.hot{background:linear-gradient(160deg,var(--forest),var(--ink));color:var(--paper);border-color:transparent}
  .fund .ft{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  .fund .fa{font-family:"Fraunces",serif;font-size:clamp(28px,3.4vw,40px);font-weight:600;margin-top:10px}
  .fund.hot .fa{color:#fff}
  .fund .fd{margin-top:6px;font-size:14.5px;color:rgba(14,42,30,.66)}
  .fund.hot .fd{color:rgba(245,241,230,.75)}
  .alloc{margin-top:20px;display:grid;gap:10px}
  .alloc-row{display:flex;align-items:center;gap:12px;font-size:13.5px}
  .alloc-bar{height:7px;border-radius:99px;background:var(--gold)}
  .alloc-row .apct{margin-left:auto;font-family:"IBM Plex Mono",monospace;color:var(--gold-soft)}
  .fund-note{margin-top:16px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--moss)}

  .contact{background:var(--ink);color:var(--paper);text-align:center}
  .contact h2{font-size:clamp(32px,4.5vw,54px);color:#fff}
  .contact h2 em{color:var(--gold);font-style:italic;font-weight:500}
  .contact p{margin-top:16px;color:rgba(245,241,230,.75);font-size:18px}
  .contact-actions{margin-top:32px;display:flex;gap:13px;justify-content:center;flex-wrap:wrap}
  .contact-meta{margin-top:44px;display:flex;gap:12px 40px;justify-content:center;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:13px;color:rgba(245,241,230,.6)}
  .contact-meta a:hover{color:var(--gold-soft)}

  footer{background:#08160F;color:rgba(245,241,230,.55);padding:38px 0;font-size:13px}
  .foot-in{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start}
  .foot-legal{font-family:"IBM Plex Mono",monospace;line-height:1.7}
  .foot-legal b{color:var(--gold-soft);font-weight:500}
  .foot-brands{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
  .foot-brands span{opacity:.75}

  .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}

  .inv-lock{grid-column:1/-1;text-align:center;background:linear-gradient(160deg,var(--forest),var(--ink));color:var(--paper);border-color:transparent}
  .inv-lock .fd{color:rgba(245,241,230,.78);max-width:52ch;margin:8px auto 0}
  .inv-lock .adm-actions{justify-content:center}
  .inv-lock .adm-btn{background:transparent;color:var(--paper);border-color:rgba(245,241,230,.35)}
  /* ADMIN */
  .adm-fab{position:fixed;right:18px;bottom:18px;z-index:80;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--gold-soft);border:1px solid var(--line-gold);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.35;transition:opacity .2s}
  .adm-fab:hover{opacity:1}
  .adm-overlay{position:fixed;inset:0;background:rgba(8,22,15,.55);backdrop-filter:blur(3px);z-index:90;display:none;align-items:stretch;justify-content:flex-end}
  .adm-overlay.open{display:flex}
  .adm{width:min(560px,100%);background:var(--paper);height:100%;overflow-y:auto;box-shadow:-20px 0 60px -20px rgba(0,0,0,.5);padding:24px 24px 60px}
  .adm h2{font-size:24px}
  .adm .adm-sub{font-size:13px;color:rgba(14,42,30,.6);margin-top:4px}
  .adm-close{float:right;background:none;border:0;font-size:24px;cursor:pointer;color:var(--ink);line-height:1}
  .adm-grp{margin-top:22px;border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}
  .adm-grp>h3{font-size:15px;font-family:"Inter Tight";font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
  .adm-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  .adm-row:first-of-type{border-top:0}
  .adm-row label{font-size:12.5px;color:rgba(14,42,30,.7)}
  .adm-row input[type=text],.adm-row textarea,.adm-full input,.adm-full textarea{width:100%;font-family:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
  .adm-full{margin-top:12px}
  .adm-full label{display:block;font-size:12px;color:rgba(14,42,30,.6);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;font-family:"IBM Plex Mono",monospace}
  textarea{resize:vertical;min-height:60px}
  .sw{position:relative;width:44px;height:24px;flex:0 0 auto}
  .sw input{opacity:0;width:0;height:0}
  .sw span{position:absolute;inset:0;background:#ccc;border-radius:999px;transition:.2s;cursor:pointer}
  .sw span::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .sw input:checked+span{background:var(--forest)}
  .sw input:checked+span::before{transform:translateX(20px)}
  .adm-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
  .adm-btn{font-family:inherit;font-size:13px;font-weight:600;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
  .adm-btn.primary{background:var(--forest);color:var(--paper);border-color:transparent}
  .adm-btn.warn{color:#a33}
  .adm-note{font-size:11.5px;color:rgba(14,42,30,.55);margin-top:10px;line-height:1.5}
  .adm-erp input{width:100%;font-family:"IBM Plex Mono",monospace;font-size:12px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-top:8px}
  .adm-status{font-size:12px;margin-top:8px;font-family:"IBM Plex Mono",monospace}

  @media(max-width:960px){
    .hero-in{grid-template-columns:1fr;gap:38px}.hero-logo{justify-self:start;max-width:300px}
    .stat-grid{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
    .subs{grid-template-columns:repeat(2,1fr)}.model-grid{grid-template-columns:1fr}.amb-grid,.fund-grid{grid-template-columns:1fr}
  }
  @media(max-width:640px){
    .nav-links{display:none}.burger{display:block}
    .nav-links.open{display:flex;position:absolute;top:70px;left:0;right:0;flex-direction:column;background:var(--paper);padding:18px 28px;gap:16px;border-bottom:1px solid var(--line)}
    .stat-grid{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--line)}.stat:last-child{border-bottom:0}
    .subs{grid-template-columns:1fr}section{padding:62px 0}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>

const STORE_KEY="vac_site_v1";
let S=load();

function load(){
 try{const r=localStorage.getItem(STORE_KEY);if(r)return deepMerge(structuredClone(DEFAULT),JSON.parse(r));}catch(e){}
 return structuredClone(DEFAULT);
}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}catch(e){}}
function deepMerge(base,ext){for(const k in ext){if(ext[k]&&typeof ext[k]==='object'&&!Array.isArray(ext[k])&&base[k])deepMerge(base[k],ext[k]);else base[k]=ext[k];}return base;}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============ RENDER ============ */
function applyI18n(){
 const t=T[S.lang];
 document.documentElement.lang=S.lang;
 document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(t[k]!=null)el.textContent=t[k];});
 // hero + contact titles (with line break + em on middle segment)
 setTitle('heroTitle',t.hero_title);
 setTitle('contactTitle',t.contact_title);
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===S.lang));
 // model
 const mg=document.getElementById('modelGrid');
 mg.innerHTML=[1,2,3].map(i=>`<div class="mstep"><div class="mk">${esc(t['m'+i+'k'])}</div><h3>${esc(t['m'+i+'h'])}</h3><p>${esc(t['m'+i+'p'])}</p></div>`).join('');
 renderTicker();renderStats();renderFresh();renderSubs();renderAmb();renderFund();renderContact();renderFoot();
}
function setTitle(id,str){
 const el=document.getElementById(id);const parts=str.split('|');
 if(parts.length===3){el.innerHTML=`${esc(parts[0])}<br><em>${esc(parts[1])}</em> ${esc(parts[2])}`;}
 else el.innerHTML=parts.map(esc).join('<br>');
}
function L(o,base){return o[base+'_'+S.lang]!=null?o[base+'_'+S.lang]:(o[base]&&o[base][S.lang]!=null?o[base][S.lang]:'');}
function renderTicker(){
 const row=S.ticker.concat(S.ticker); // duplicate for seamless loop
 document.getElementById('tickerRow').innerHTML=row.map(x=>{const p=x[S.lang].split('|');return `<span>${esc(p[0])} <b>${esc(p[1]||'')}</b></span>`;}).join('');
}
function renderStats(){
 document.getElementById('statGrid').innerHTML=S.stats.filter(s=>s.vis).map(s=>
  `<div class="stat"><div class="num">${esc(s.num)}<small>${esc(s['small_'+S.lang])}</small></div><div class="lab">${esc(s['lab_'+S.lang])}</div><div class="sub">${esc(s['sub_'+S.lang])}</div></div>`).join('');
}
function renderFresh(){
 document.getElementById('freshGrid').innerHTML=S.fresh.filter(x=>x.vis).map(x=>
  `<div class="stat"><div class="num">${esc(x.num)}</div><div class="lab">${esc(x['lab_'+S.lang])}</div><div class="sub">${esc(x['sub_'+S.lang])}</div></div>`).join('');
 document.getElementById('live').style.display=S.fresh.some(x=>x.vis)?'':'none';
}
function renderSubs(){
 const visit=S.lang==='fr'?'Visiter le site':'Visit site';
 document.getElementById('subsGrid').innerHTML=S.subs.filter(s=>s.vis).map(s=>{
  const link=s.url?`<a class="sub-link" href="${esc(s.url)}" target="_blank" rel="noopener">${visit} ${esc(s.url.replace('https://',''))} →</a>`:'';
  return `<article class="sub reveal in"><div class="sub-top"><div class="logo-tile"><img src="${s.logo}" alt="${esc(s.name)}"></div><span class="phase">${esc(s['phase_'+S.lang])}</span></div><h3>${esc(s.name)}</h3><div class="sub-tag">${esc(s['tag_'+S.lang])}</div><p class="sub-mission">${esc(s['mission_'+S.lang])}</p>${link}</article>`;
 }).join('');
}
function renderAmb(){
 document.getElementById('ambGrid').innerHTML=S.ambition.filter(a=>a.vis).map(a=>
  `<div class="amb"><div class="ak">${esc(a.year)}</div><h3>${esc(a['h_'+S.lang])}</h3><p>${esc(a['p_'+S.lang])}</p></div>`).join('');
}
function lockHTML(){
 const fr=S.lang==='fr';
 return `<div class="fund inv-lock"><div class="ft">${fr?'Accès réservé':'Restricted access'}</div>
  <div class="fa" style="font-size:26px">${fr?'Espace investisseurs':'Investor area'}</div>
  <div class="fd">${fr?"Feuille de route, financement et modèle financier — réservés aux investisseurs vérifiés.":"Roadmap, funding and financial model — reserved for verified investors."}</div>
  <div class="adm-actions" style="margin-top:18px"><button class="btn-gold" onclick="unlockInvestor()">${fr?"J'ai un code d'accès":"I have an access code"}</button>
  <a class="adm-btn" href="mailto:contact@vita-agro.com?subject=Investor%20access%20request">${fr?'Demander un accès':'Request access'}</a></div></div>`;
}
function unlockInvestor(){
 const fr=S.lang==='fr';
 const p=prompt(fr?"Code d'accès investisseur :":"Investor access code:");
 if(p===null)return;
 if(p===S.investorPass){window.invOK=true;renderFund();}
 else alert(fr?"Code invalide. Contactez-nous pour obtenir un accès.":"Invalid code. Contact us to request access.");
}
function renderFund(){
 if(!window.invOK){document.getElementById('fundGrid').innerHTML=lockHTML();return;}
 const f=S.funding;let html='';
 if(f.tour1.vis){
  html+=`<div class="fund hot"><div class="ft">${esc(f.tour1['label_'+S.lang])}</div><div class="fa">${esc(f.tour1.amount)}</div><div class="fd">${esc(f.tour1['desc_'+S.lang])}</div><div class="alloc">`+
   f.tour1.alloc.map(a=>`<div class="alloc-row"><span>${esc(a[S.lang])}</span><div class="alloc-bar" style="width:${a.pct}%"></div><span class="apct">${a.pct} %</span></div>`).join('')+`</div><p class="fund-note" style="color:var(--gold-soft)">${S.lang==='fr'?'Affectation détaillée des fonds : sur demande.':'Detailed use of funds: on request.'}</p></div>`;
 }
 if(f.tour2.vis){
  html+=`<div class="fund"><div class="ft">${esc(f.tour2['label_'+S.lang])}</div><div class="fa">${esc(f.tour2.amount)}</div><div class="fd">${esc(f.tour2['desc_'+S.lang])}</div><p style="margin-top:20px;font-size:15px;color:rgba(14,42,30,.72)">${esc(f.tour2['body_'+S.lang])}</p><p class="fund-note">${esc(f.tour2['note_'+S.lang])}</p></div>`;
 }
 document.getElementById('fundGrid').innerHTML=html;
}
function renderContact(){
 const c=S.contact;
 const em=document.getElementById('cEmail');em.textContent=c.email;em.href='mailto:'+c.email;em.hidden=!c.vis_email;
 const ph=document.getElementById('cPhone');ph.textContent=c.phone;ph.href='tel:'+c.phone.replace(/\s/g,'');ph.hidden=!c.vis_phone;
 const meta=document.getElementById('contactMeta');
 meta.hidden=!c.vis_meta;
 meta.innerHTML=`<a href="https://vita-agro.com" target="_blank" rel="noopener">vita-agro.com</a><a href="mailto:${esc(c.email2)}">${esc(c.email2)}</a><span>Vita Agro Capital</span><span>${esc(c['siege_'+S.lang])}</span>`;
}
function renderFoot(){document.getElementById('footLegal').textContent=S.contact['legal_'+S.lang];}

/* ============ LANG + NAV ============ */
function setLang(l){S.lang=l;save();applyI18n();}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
const burger=document.getElementById('burger'),links=document.getElementById('navlinks');
burger&&burger.addEventListener('click',()=>links.classList.toggle('open'));
links&&links.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>links.classList.remove('open')));
const io=new IntersectionObserver((es)=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

/* ============ ADMIN PANEL ============ */
const ADMIN_PASS="Jawadino"; // change this. Client-side gate only — not real security.
let admAuthed=false;
const overlay=document.getElementById('admOverlay'),panel=document.getElementById('admPanel');
document.getElementById('admFab').addEventListener('click',openAdmin);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeAdmin();});
function openAdmin(){
 if(!admAuthed){const p=prompt("Admin passcode:");if(p!==ADMIN_PASS){if(p!==null)alert("Wrong passcode.");return;}admAuthed=true;}
 buildAdmin();overlay.classList.add('open');
}
function closeAdmin(){overlay.classList.remove('open');}
function sw(checked,onch){const id='s'+Math.random().toString(36).slice(2);return `<label class="sw"><input type="checkbox" ${checked?'checked':''} data-sw="${id}"><span></span></label>`;}
function buildAdmin(){
 const b=T[S.lang];
 let h=`<button class="adm-close" id="admClose">×</button><h2>Admin panel</h2><div class="adm-sub">Edit figures, choose what is public, sync from your ERP. Nothing shows unless you allow it.</div>`;
 // language default
 h+=`<div class="adm-grp"><h3>Default language</h3><div class="adm-actions"><button class="adm-btn ${S.lang==='en'?'primary':''}" data-setlang="en">English</button><button class="adm-btn ${S.lang==='fr'?'primary':''}" data-setlang="fr">Français</button></div></div>`;
 // stats
 h+=`<div class="adm-grp"><h3>Key figures</h3>`;
 S.stats.forEach((s,i)=>{h+=`<div class="adm-row"><label>${esc(s['lab_'+S.lang])||s.id}</label><div style="display:flex;gap:8px;align-items:center"><input type="text" data-p="stats.${i}.num" value="${esc(s.num)}" style="width:120px"><label class="sw"><input type="checkbox" data-p="stats.${i}.vis" ${s.vis?'checked':''}><span></span></label></div></div>`;});
 h+=`</div>`;
 // vita fresh live
 h+=`<div class="adm-grp"><h3>Vita Fresh — live figures (ERP)</h3>`;
 S.fresh.forEach((x,i)=>{h+=`<div class="adm-row"><label>${esc(x['lab_'+S.lang])}</label><div style="display:flex;gap:8px;align-items:center"><input type="text" data-p="fresh.${i}.num" value="${esc(x.num)}" style="width:120px"><label class="sw"><input type="checkbox" data-p="fresh.${i}.vis" ${x.vis?'checked':''}><span></span></label></div></div>`;});
 h+=`</div>`;
 // investor access
 h+=`<div class="adm-grp"><h3>Investor area — access code</h3><div class="adm-full"><label>Access code</label><input type="text" data-p="investorPass" value="${esc(S.investorPass)}"></div><div class="adm-note">Share this code only with verified investors. Client-side gate — for deterrence, not vault-grade security.</div></div>`;
 // subsidiaries
 h+=`<div class="adm-grp"><h3>Subsidiaries — mission & visibility</h3>`;
 S.subs.forEach((s,i)=>{h+=`<div class="adm-row"><label><b>${esc(s.name)}</b></label><label class="sw"><input type="checkbox" data-p="subs.${i}.vis" ${s.vis?'checked':''}><span></span></label></div>
  <div class="adm-full"><label>Mission (EN)</label><textarea data-p="subs.${i}.mission_en">${esc(s.mission_en)}</textarea></div>
  <div class="adm-full"><label>Mission (FR)</label><textarea data-p="subs.${i}.mission_fr">${esc(s.mission_fr)}</textarea></div>`;});
 h+=`</div>`;
 // funding
 h+=`<div class="adm-grp"><h3>Funding</h3>
  <div class="adm-row"><label>Round 1 amount</label><div style="display:flex;gap:8px;align-items:center"><input type="text" data-p="funding.tour1.amount" value="${esc(S.funding.tour1.amount)}" style="width:150px"><label class="sw"><input type="checkbox" data-p="funding.tour1.vis" ${S.funding.tour1.vis?'checked':''}><span></span></label></div></div>
  <div class="adm-row"><label>Round 2 amount</label><div style="display:flex;gap:8px;align-items:center"><input type="text" data-p="funding.tour2.amount" value="${esc(S.funding.tour2.amount)}" style="width:150px"><label class="sw"><input type="checkbox" data-p="funding.tour2.vis" ${S.funding.tour2.vis?'checked':''}><span></span></label></div></div>
  <div class="adm-full"><label>Round 1 allocation %</label>`;
 S.funding.tour1.alloc.forEach((a,i)=>{h+=`<div class="adm-row"><label>${esc(a[S.lang])}</label><input type="text" data-p="funding.tour1.alloc.${i}.pct" value="${a.pct}" style="width:70px"></div>`;});
 h+=`</div><div class="adm-full"><label>Round 2 note</label><input type="text" data-p="funding.tour2.note_en" value="${esc(S.funding.tour2.note_en)}"><input type="text" data-p="funding.tour2.note_fr" value="${esc(S.funding.tour2.note_fr)}" style="margin-top:6px"></div></div>`;
 // contact
 h+=`<div class="adm-grp"><h3>Contact</h3>
  <div class="adm-full"><label>Primary email</label><input type="text" data-p="contact.email" value="${esc(S.contact.email)}"></div>
  <div class="adm-full"><label>Phone</label><input type="text" data-p="contact.phone" value="${esc(S.contact.phone)}"></div>
  <div class="adm-row"><label>Show email button</label><label class="sw"><input type="checkbox" data-p="contact.vis_email" ${S.contact.vis_email?'checked':''}><span></span></label></div>
  <div class="adm-row"><label>Show phone button</label><label class="sw"><input type="checkbox" data-p="contact.vis_phone" ${S.contact.vis_phone?'checked':''}><span></span></label></div></div>`;
 // ERP sync
 h+=`<div class="adm-grp adm-erp"><h3>ERP sync (FreshLink)</h3>
  <div class="adm-note">Paste a <b>read-only JSON URL</b> exposed by your ERP (never your DB credentials). Expected shape: <code>{"stats":{"subs":"5",...}}</code>. The site fetches figures and updates the ones you map. Direct database access from a static site isn't possible for security reasons.</div>
  <input type="text" id="erpUrl" placeholder="https://api.your-erp.com/public/vac-metrics.json" value="${esc(S.erpUrl||'')}">
  <div class="adm-actions"><button class="adm-btn" id="erpFetch">Fetch from ERP</button></div>
  <div class="adm-status" id="erpStatus"></div></div>`;
 // actions
 h+=`<div class="adm-actions">
  <button class="adm-btn primary" id="admSave">Save</button>
  <button class="adm-btn" id="admExport">Export JSON</button>
  <button class="adm-btn" id="admImport">Import JSON</button>
  <button class="adm-btn warn" id="admReset">Reset all</button>
 </div>
 <div class="adm-note">“Save” stores your settings in this browser (localStorage). To keep them permanently on your live site, use <b>Export JSON</b> and commit the file, or re-import it after deploying.</div>
 <input type="file" id="admFile" accept="application/json" hidden>`;
 panel.innerHTML=h;
 wireAdmin();
}
function setPath(path,val){
 const ks=path.split('.');let o=S;
 for(let i=0;i<ks.length-1;i++){o=o[ks[i]];}
 const last=ks[ks.length-1];
 if(typeof o[last]==='boolean')o[last]=!!val;
 else if(path.endsWith('.pct'))o[last]=parseFloat(val)||0;
 else o[last]=val;
}
function wireAdmin(){
 document.getElementById('admClose').onclick=closeAdmin;
 panel.querySelectorAll('[data-setlang]').forEach(btn=>btn.onclick=()=>{setLang(btn.dataset.setlang);buildAdmin();});
 panel.querySelectorAll('[data-p]').forEach(inp=>{
  const ev=inp.type==='checkbox'?'change':'input';
  inp.addEventListener(ev,()=>{setPath(inp.dataset.p,inp.type==='checkbox'?inp.checked:inp.value);applyI18n();});
 });
 document.getElementById('admSave').onclick=()=>{save();flash('Saved.');};
 document.getElementById('admReset').onclick=()=>{if(confirm('Reset all figures and visibility to defaults?')){S=structuredClone(DEFAULT);save();applyI18n();buildAdmin();}};
 document.getElementById('admExport').onclick=()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vita-agro-config.json';a.click();};
 const file=document.getElementById('admFile');
 document.getElementById('admImport').onclick=()=>file.click();
 file.onchange=()=>{const f=file.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=deepMerge(structuredClone(DEFAULT),JSON.parse(r.result));save();applyI18n();buildAdmin();flash('Imported.');}catch(e){alert('Invalid JSON.');}};r.readAsText(f);};
 document.getElementById('erpFetch').onclick=erpFetch;
}
function flash(msg){const s=document.getElementById('erpStatus');if(s){s.textContent=msg;s.style.color='var(--forest)';setTimeout(()=>{if(s)s.textContent='';},2500);}}
async function erpFetch(){
 const url=document.getElementById('erpUrl').value.trim();const st=document.getElementById('erpStatus');
 S.erpUrl=url;save();
 if(!url){st.textContent='Enter a URL first.';st.style.color='#a33';return;}
 st.textContent='Fetching…';st.style.color='var(--moss)';
 try{
  const res=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const d=await res.json();
  // map known fields if present
  if(d.stats){S.stats.forEach(s=>{if(d.stats[s.id]!=null)s.num=String(d.stats[s.id]);});}
  if(d.fresh){S.fresh.forEach(x=>{if(d.fresh[x.id]!=null){x.num=String(d.fresh[x.id]);x.vis=true;}});}
  if(d.funding){if(d.funding.tour1_amount)S.funding.tour1.amount=d.funding.tour1_amount;if(d.funding.tour2_amount)S.funding.tour2.amount=d.funding.tour2_amount;}
  save();applyI18n();buildAdmin();
  st.textContent='Synced ✓ — review, then Save.';st.style.color='var(--forest)';
 }catch(e){st.textContent='Failed: '+e.message+' (check URL / CORS on your ERP).';st.style.color='#a33';}
}

/* boot */
applyI18n();
</script>
</body>
</html>
