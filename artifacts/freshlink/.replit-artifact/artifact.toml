kind = "web"
previewPath = "/"
title = "FreshLink Vita Fresh ERP"
version = "1.0.0"
id = "artifacts/freshlink"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21893

[services.development]
run = "pnpm --filter @workspace/freshlink run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/freshlink", "run", "build" ]
publicDir = "artifacts/freshlink/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21893"
BASE_PATH = "/"
