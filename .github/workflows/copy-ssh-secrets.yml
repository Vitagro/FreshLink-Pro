name: Copier les secrets SSH vers VitaFresh

# Workflow JETABLE (a supprimer apres usage) : copie les 4 secrets SSH
# Hostinger de ce repo vers Vitagro/VitaFresh pour que son deploy marche.
# Les valeurs des secrets sont en write-only via l'API : seul un workflow
# peut les lire au runtime, d'ou cette copie. Necessite le secret
# GH_ADMIN_TOKEN (token gh du compte Vitagro, admin de VitaFresh) —
# a supprimer lui aussi apres usage.
on:
  workflow_dispatch: {}

jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
    steps:
      - name: Copier les 4 secrets
        run: |
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PASSWORD; do
            printf '%s' "${!name}" | gh secret set "$name" -R Vitagro/VitaFresh
            echo "$name copie."
          done
