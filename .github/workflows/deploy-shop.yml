name: Deploy Shop to Hostinger (depuis VitaFresh)

# Le repo Vitagro/VitaFresh a son propre workflow de deploy mais AUCUN secret
# SSH configure (ses 2 runs ont echoue sur "Bad port '@'"). En attendant que
# les secrets y soient ajoutes, ce workflow deploie la boutique depuis ici :
# VitaFresh est public, on le checkout et on expedie site-vitrine/ vers
# Hostinger avec les memes secrets SSH (mot de passe) que le deploy ERP.
# Declenchement manuel uniquement (workflow_dispatch).
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-shop
  cancel-in-progress: false

env:
  REMOTE_APP_DIR: /home/u387018932/domains/vita-agro.com/public_html/shop
  REMOTE_RELEASE_DIR: /home/u387018932/domains/vita-agro.com/public_html/shop-releases/${{ github.run_id }}
  REMOTE_BACKUP_DIR: /home/u387018932/domains/vita-agro.com/public_html/shop-prev
  SITE_URL: https://shop.vita-agro.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Vitagro/VitaFresh
          ref: main

      - name: Package site-vitrine
        run: tar -czf shop-deploy.tar.gz -C site-vitrine .

      - name: Set up SSH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          for i in 1 2 3 4 5; do
            ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null && break
            echo "ssh-keyscan attempt $i failed, retrying..."
            sleep 5
          done

      - name: Upload new release (does not touch the live app yet)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          SSH="sshpass -e ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          $SSH "mkdir -p '${{ env.REMOTE_RELEASE_DIR }}'"
          sshpass -e scp -P "${{ secrets.SSH_PORT }}" shop-deploy.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.REMOTE_RELEASE_DIR }}/shop-deploy.tar.gz"
          $SSH "tar -xzf '${{ env.REMOTE_RELEASE_DIR }}/shop-deploy.tar.gz' -C '${{ env.REMOTE_RELEASE_DIR }}' && rm '${{ env.REMOTE_RELEASE_DIR }}/shop-deploy.tar.gz'"

      - name: Swap into place (backup current release first)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          SSH="sshpass -e ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          $SSH "rm -rf '${{ env.REMOTE_BACKUP_DIR }}' && mv '${{ env.REMOTE_APP_DIR }}' '${{ env.REMOTE_BACKUP_DIR }}' && mv '${{ env.REMOTE_RELEASE_DIR }}' '${{ env.REMOTE_APP_DIR }}'"

      - name: Health check
        id: health
        run: |
          sleep 5
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "${{ env.SITE_URL }}")
          echo "http_code=$code"
          if [ "$code" != "200" ]; then
            echo "unhealthy=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Rollback on failed health check
        if: failure() && steps.health.outputs.unhealthy == 'true'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          SSH="sshpass -e ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          $SSH "rm -rf '${{ env.REMOTE_APP_DIR }}' && mv '${{ env.REMOTE_BACKUP_DIR }}' '${{ env.REMOTE_APP_DIR }}'"
          echo "::error::Deploy failed health check — rolled back to previous release."
