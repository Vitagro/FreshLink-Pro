name: Deploy static sites to Hostinger

# Deploys the 3 static marketing sites under sites/ to their subdomains.
# Static HTML, no build step. Same Hostinger account/SSH secrets as the ERP
# deploy (deploy.yml) — vita-agro.com, tech.vita-agro.com and fresh.vita-agro.com
# all live under the same domains/vita-agro.com/public_html tree, alongside the
# already-live erp/ and shop/ subfolders (never touched by this workflow).
on:
  push:
    branches: [main]
    paths: ["sites/**", ".github/workflows/deploy-sites.yml"]
  workflow_dispatch: {}

concurrency:
  group: deploy-sites
  cancel-in-progress: false

env:
  REMOTE_BASE: /home/u387018932/domains/vita-agro.com/public_html

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for i in 1 2 3 4 5; do
            ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null && break
            echo "ssh-keyscan attempt $i failed, retrying..."
            sleep 5
          done

      # ── tech.vita-agro.com and fresh.vita-agro.com: isolated subfolders,
      # safe to swap wholesale (same atomic-release pattern as erp/). ──
      - name: Deploy subfolder sites (tech, fresh)
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          SCP="scp -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }}"
          for name in vita-tech:tech vita-fresh:fresh; do
            src="${name%%:*}"; sub="${name##*:}"
            release_dir="${{ env.REMOTE_BASE }}/${sub}-releases/${{ github.sha }}"
            backup_dir="${{ env.REMOTE_BASE }}/${sub}-prev"
            live_dir="${{ env.REMOTE_BASE }}/${sub}"
            tar -czf "${src}.tar.gz" -C "sites/${src}" .
            $SSH "mkdir -p '$release_dir'"
            $SCP "${src}.tar.gz" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${release_dir}/site.tar.gz"
            $SSH "tar -xzf '${release_dir}/site.tar.gz' -C '$release_dir' && rm '${release_dir}/site.tar.gz'"
            $SSH "rm -rf '$backup_dir'; [ -d '$live_dir' ] && mv '$live_dir' '$backup_dir'; mv '$release_dir' '$live_dir'"
          done

      # ── vita-agro.com (root domain): only replace index.html — public_html
      # also holds the erp/ and shop/ subfolders, never move/replace the whole
      # directory here. ──
      - name: Deploy root site (vita-agro.com)
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          SCP="scp -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }}"
          $SSH "[ -f '${{ env.REMOTE_BASE }}/index.html' ] && cp '${{ env.REMOTE_BASE }}/index.html' '${{ env.REMOTE_BASE }}/index.html.prev' || true"
          $SCP sites/vita-agro/index.html "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.REMOTE_BASE }}/index.html.new"
          $SSH "mv '${{ env.REMOTE_BASE }}/index.html.new' '${{ env.REMOTE_BASE }}/index.html'"

      - name: Health check
        id: health
        run: |
          sleep 5
          fail=0
          for url in https://vita-agro.com https://tech.vita-agro.com https://fresh.vita-agro.com; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$url")
            echo "$url -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$url returned $code"
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            echo "unhealthy=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Rollback subfolder sites on failed health check
        if: failure() && steps.health.outputs.unhealthy == 'true'
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          for sub in tech fresh; do
            live_dir="${{ env.REMOTE_BASE }}/${sub}"
            backup_dir="${{ env.REMOTE_BASE }}/${sub}-prev"
            $SSH "[ -d '$backup_dir' ] && rm -rf '$live_dir' && mv '$backup_dir' '$live_dir' || true"
          done
          $SSH "[ -f '${{ env.REMOTE_BASE }}/index.html.prev' ] && mv '${{ env.REMOTE_BASE }}/index.html.prev' '${{ env.REMOTE_BASE }}/index.html' || true"
          echo "::error::Deploy failed health check — rolled back."

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
